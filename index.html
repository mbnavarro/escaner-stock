<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escáner de Stock - WestSide Tech</title>
  <style>
    body { font-family: sans-serif; background:#0E1117; color:#F2F4F6; margin:0; padding:16px; }
    h1 { font-size:1.1rem; }
    #reader { width:100%; border-radius:8px; overflow:hidden; margin-bottom:12px; }
    .toggle { display:flex; gap:8px; margin-bottom:12px; }
    .toggle button { flex:1; padding:10px; border-radius:8px; border:1px solid #2A313D; background:#161A22; color:#8B93A1; font-weight:600; }
    .toggle button.active { background:#173330; color:#2DD4BF; border-color:#2DD4BF; }
    input[type=number], input[type=text] { width:100%; padding:10px; margin-bottom:12px; border-radius:8px; border:1px solid #2A313D; background:#161A22; color:#F2F4F6; box-sizing:border-box; font-size:0.9rem; }
    #resultado { padding:12px; border-radius:8px; margin-top:12px; font-size:0.9rem; }
    .ok { background:#173330; color:#2DD4BF; }
    .error { background:#2E1B17; color:#EF6B4E; }
    #confirmacion { display:none; background:#161A22; border:1px solid #2A313D; border-radius:8px; padding:14px; margin-top:12px; }
    #confirmTexto { font-size:0.95rem; margin-bottom:12px; }
    .confirm-botones { display:flex; gap:8px; }
    .confirm-botones button { flex:1; padding:10px; border-radius:8px; font-weight:600; border:1px solid; }
    #btnConfirmar { background:#173330; color:#2DD4BF; border-color:#2DD4BF; }
    #btnConfirmar:disabled { opacity:0.4; }
    #btnCancelar { background:#2E1B17; color:#EF6B4E; border-color:#EF6B4E; }

    /* Selector de color (Fundas S) */
    #selectorColor { display:none; margin-bottom:12px; }
    #selectorColor .titulo { color:#8B93A1; font-size:0.75rem; margin-bottom:8px; }
    #opcionesColor { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
    .chip { padding:8px 12px; border-radius:20px; border:1px solid #2A313D; background:#0E1117; color:#F2F4F6; font-size:0.85rem; }
    .chip.active { background:#173330; color:#2DD4BF; border-color:#2DD4BF; }
    .chip.nuevo { color:#8B93A1; border-style:dashed; }
    #colorNuevo { display:none; margin-bottom:0; }
    #avisoColor { color:#EF6B4E; font-size:0.8rem; margin-top:6px; display:none; }

    /* Foto de la funda */
    #bloqueFoto { display:none; margin-top:12px; }
    .btn-foto { display:inline-block; padding:10px 14px; border-radius:8px; border:1px solid #2DD4BF; background:#173330; color:#2DD4BF; font-weight:600; font-size:0.85rem; cursor:pointer; }
    #previewFoto { display:none; width:96px; height:96px; object-fit:cover; border-radius:8px; margin-top:10px; border:1px solid #2A313D; }
    #avisoFoto { color:#8B93A1; font-size:0.75rem; margin-top:6px; }
  </style>
</head>
<body>
  <h1>Escáner de Stock — WestSide Tech</h1>
  <div class="toggle">
    <button id="btnSumar" class="active">Sumar stock</button>
    <button id="btnVender">Vender</button>
  </div>
  <input type="number" id="cantidad" value="1" min="1" placeholder="Cantidad">
  <div id="reader"></div>
  <div id="resultado"></div>

  <div id="confirmacion">
    <div id="confirmTexto"></div>

    <div id="selectorColor">
      <div class="titulo">Elegí el color</div>
      <div id="opcionesColor"></div>
      <input type="text" id="colorNuevo" placeholder="Nombre del color nuevo">
      <div id="avisoColor"></div>

      <div id="bloqueFoto">
        <label class="btn-foto" for="inputFoto">📷 Sacar foto (opcional)</label>
        <input type="file" id="inputFoto" accept="image/*" capture="environment" style="display:none;">
        <div><img id="previewFoto" alt="Foto de la funda"></div>
        <div id="avisoFoto"></div>
      </div>
    </div>

    <div class="confirm-botones">
      <button id="btnConfirmar">Confirmar</button>
      <button id="btnCancelar">Cancelar</button>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbypo6SHxKmvkLytTUGFdnV7WKB9O2Kj0cYrHl6KzT6h1SJfJJVLJW0iprSiv2Ow9P5Ptg/exec";
    var accion = 'sumar';
    var procesando = false;
    var pendiente = null;

    document.getElementById('btnSumar').onclick = function () {
      accion = 'sumar';
      document.getElementById('btnSumar').classList.add('active');
      document.getElementById('btnVender').classList.remove('active');
    };
    document.getElementById('btnVender').onclick = function () {
      accion = 'vender';
      document.getElementById('btnVender').classList.add('active');
      document.getElementById('btnSumar').classList.remove('active');
    };

    var resultadoDiv = document.getElementById('resultado');
    var confirmacionDiv = document.getElementById('confirmacion');
    var confirmTextoDiv = document.getElementById('confirmTexto');
    var selectorColorDiv = document.getElementById('selectorColor');
    var opcionesColorDiv = document.getElementById('opcionesColor');
    var colorNuevoInput = document.getElementById('colorNuevo');
    var avisoColorDiv = document.getElementById('avisoColor');
    var btnConfirmar = document.getElementById('btnConfirmar');
    var bloqueFoto = document.getElementById('bloqueFoto');
    var inputFoto = document.getElementById('inputFoto');
    var previewFoto = document.getElementById('previewFoto');
    var avisoFoto = document.getElementById('avisoFoto');

    function onScanSuccess(decodedText) {
      if (procesando) return;
      procesando = true;
      scanner.pause(true);

      var cantidad = document.getElementById('cantidad').value || 1;
      pendiente = { codigo: decodedText, cantidad: cantidad, accion: accion };

      resultadoDiv.className = '';
      resultadoDiv.textContent = 'Buscando producto...';
      confirmacionDiv.style.display = 'none';

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ codigo: decodedText, accion: 'buscar' })
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          resultadoDiv.textContent = '';
          if (data.ok) {
            mostrarConfirmacion(data);
          } else {
            resultadoDiv.className = 'error';
            resultadoDiv.textContent = data.mensaje;
            setTimeout(finalizarEscaneo, 2000);
          }
        })
        .catch(function (err) {
          resultadoDiv.className = 'error';
          resultadoDiv.textContent = 'Error: ' + err.message;
          setTimeout(finalizarEscaneo, 2000);
        });
    }

    function mostrarConfirmacion(data) {
      pendiente.modelo = data.modelo;
      pendiente.categoria = data.categoria;
      pendiente.stockActual = data.stockActual;
      pendiente.color = data.color || '';
      pendiente.requiereColor = !!data.requiereColor;
      pendiente.colores = data.colores || [];
      pendiente.foto = '';

      if (pendiente.requiereColor) {
        pendiente.color = '';
        armarSelectorColor();
      } else {
        selectorColorDiv.style.display = 'none';
      }

      actualizarConfirmacion();
      confirmacionDiv.style.display = 'block';
    }

    // ---------- Selector de color (Fundas S) ----------

    function armarSelectorColor() {
      opcionesColorDiv.innerHTML = '';
      colorNuevoInput.value = '';
      colorNuevoInput.style.display = 'none';
      avisoColorDiv.style.display = 'none';

      // Al vender solo se muestran los colores con stock; al sumar, todos
      var lista = pendiente.accion === 'sumar'
        ? pendiente.colores
        : pendiente.colores.filter(function (c) { return c.stock > 0; });

      lista.forEach(function (c) {
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip';
        chip.textContent = c.color + ' (' + c.stock + ')';
        chip.onclick = function () { elegirColor(c.color, chip, false); };
        opcionesColorDiv.appendChild(chip);
      });

      if (pendiente.accion === 'sumar') {
        var chipNuevo = document.createElement('button');
        chipNuevo.type = 'button';
        chipNuevo.className = 'chip nuevo';
        chipNuevo.textContent = '+ Color nuevo';
        chipNuevo.onclick = function () { elegirColor('', chipNuevo, true); };
        opcionesColorDiv.appendChild(chipNuevo);
      } else if (lista.length === 0) {
        avisoColorDiv.textContent = 'No hay stock de ningún color de este modelo.';
        avisoColorDiv.style.display = 'block';
      }

      selectorColorDiv.style.display = 'block';
    }

    function elegirColor(color, chip, esNuevo) {
      var chips = opcionesColorDiv.querySelectorAll('.chip');
      for (var i = 0; i < chips.length; i++) chips[i].classList.remove('active');
      chip.classList.add('active');
      avisoColorDiv.style.display = 'none';

      limpiarFoto();
      if (esNuevo) {
        pendiente.colorNuevo = true;
        pendiente.color = '';
        colorNuevoInput.style.display = 'block';
        colorNuevoInput.focus();
      } else {
        pendiente.colorNuevo = false;
        pendiente.color = color;
        colorNuevoInput.style.display = 'none';
      }
      actualizarConfirmacion();
    }

    colorNuevoInput.oninput = function () {
      pendiente.color = colorNuevoInput.value.trim();
      actualizarConfirmacion();
    };

    function stockDelColor(color) {
      for (var i = 0; i < pendiente.colores.length; i++) {
        if (pendiente.colores[i].color === color) return pendiente.colores[i].stock;
      }
      return 0;
    }

    function actualizarConfirmacion() {
      var verbo = pendiente.accion === 'sumar' ? 'sumar' : 'restar';
      var texto;

      if (pendiente.requiereColor) {
        if (pendiente.color) {
          var stockTexto = pendiente.colorNuevo
            ? 'Color nuevo'
            : 'Stock del color: ' + stockDelColor(pendiente.color);
          texto = '¿Confirmás ' + verbo + ' ' + pendiente.cantidad + ' de "' + pendiente.modelo + '" - Color: ' + pendiente.color +
            ' (' + pendiente.categoria + ')? ' + stockTexto + ' · Total del modelo: ' + pendiente.stockActual;
        } else {
          texto = '"' + pendiente.modelo + '" (' + pendiente.categoria + ') · Total del modelo: ' + pendiente.stockActual;
        }
        btnConfirmar.disabled = !pendiente.color;
      } else {
        var colorTexto = pendiente.color ? ' - Color: ' + pendiente.color : '';
        texto = '¿Confirmás ' + verbo + ' ' + pendiente.cantidad + ' de "' + pendiente.modelo + '"' + colorTexto +
          ' (' + pendiente.categoria + ')? Stock actual: ' + pendiente.stockActual;
        btnConfirmar.disabled = false;
      }

      confirmTextoDiv.textContent = texto;
      actualizarBloqueFoto();
    }

    // ---------- Foto de la funda ----------

    function colorTieneFoto(color) {
      for (var i = 0; i < pendiente.colores.length; i++) {
        if (pendiente.colores[i].color === color) return !!pendiente.colores[i].foto;
      }
      return false;
    }

    // Se ofrece sacar foto si es un color nuevo o si el color elegido todavía no tiene foto
    function actualizarBloqueFoto() {
      var ofrecer = pendiente && pendiente.requiereColor && pendiente.color &&
        (pendiente.colorNuevo || !colorTieneFoto(pendiente.color));
      bloqueFoto.style.display = ofrecer ? 'block' : 'none';
      if (!ofrecer) limpiarFoto();
    }

    function limpiarFoto() {
      if (pendiente) pendiente.foto = '';
      inputFoto.value = '';
      previewFoto.style.display = 'none';
      previewFoto.removeAttribute('src');
      avisoFoto.textContent = '';
    }

    function reducirImagen(archivo, maxLado, calidad, cb) {
      var img = new Image();
      var url = URL.createObjectURL(archivo);
      img.onload = function () {
        var escala = Math.min(1, maxLado / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * escala);
        c.height = Math.round(img.height * escala);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        cb(c.toDataURL('image/jpeg', calidad));
      };
      img.onerror = function () { cb(null); };
      img.src = url;
    }

    inputFoto.onchange = function () {
      var archivo = inputFoto.files && inputFoto.files[0];
      if (!archivo) return;
      avisoFoto.textContent = 'Preparando foto...';
      reducirImagen(archivo, 1000, 0.7, function (dataUrl) {
        if (!dataUrl) { avisoFoto.textContent = 'No se pudo leer la foto.'; return; }
        pendiente.foto = dataUrl.split(',')[1];
        previewFoto.src = dataUrl;
        previewFoto.style.display = 'block';
        avisoFoto.textContent = 'Foto lista. Se guarda al confirmar.';
      });
    };

    // ---------- Confirmar / cancelar ----------

    btnConfirmar.onclick = function () {
      if (pendiente.requiereColor && !pendiente.color) {
        avisoColorDiv.textContent = 'Elegí un color antes de confirmar.';
        avisoColorDiv.style.display = 'block';
        return;
      }

      confirmacionDiv.style.display = 'none';
      resultadoDiv.className = '';
      resultadoDiv.textContent = 'Procesando...';

      var cuerpo = { codigo: pendiente.codigo, accion: pendiente.accion, cantidad: pendiente.cantidad };
      if (pendiente.requiereColor) cuerpo.color = pendiente.color;
      var fotoPendiente = pendiente.foto;
      var codigoFoto = pendiente.codigo;
      var colorFoto = pendiente.color;

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(cuerpo)
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          resultadoDiv.className = data.ok ? 'ok' : 'error';
          resultadoDiv.textContent = data.mensaje;
          if (data.ok && fotoPendiente) {
            resultadoDiv.textContent = data.mensaje + ' · Subiendo foto...';
            return fetch(SCRIPT_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ accion: 'foto', codigo: codigoFoto, color: colorFoto, imagen: fotoPendiente })
            })
              .then(function (res) { return res.json(); })
              .then(function (f) {
                resultadoDiv.textContent = data.mensaje + (f.ok ? ' · Foto guardada' : ' · La foto no se guardó: ' + f.mensaje);
              });
          }
        })
        .then(function () { finalizarEscaneo(); })
        .catch(function (err) {
          resultadoDiv.className = 'error';
          resultadoDiv.textContent = 'Error: ' + err.message;
          finalizarEscaneo();
        });
    };

    document.getElementById('btnCancelar').onclick = function () {
      confirmacionDiv.style.display = 'none';
      resultadoDiv.className = '';
      resultadoDiv.textContent = '';
      finalizarEscaneo();
    };

    function finalizarEscaneo() {
      pendiente = null;
      procesando = false;
      selectorColorDiv.style.display = 'none';
      bloqueFoto.style.display = 'none';
      previewFoto.style.display = 'none';
      inputFoto.value = '';
      btnConfirmar.disabled = false;
      scanner.resume();
    }

    var scanner = new Html5Qrcode("reader", {
      formatsToSupport: [ Html5QrcodeSupportedFormats.CODE_128 ]
    });
    scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 100 } },
      onScanSuccess
    );
  </script>
</body>
</html>
